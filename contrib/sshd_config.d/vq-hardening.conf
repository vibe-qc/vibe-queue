# vq remote-access SSH hardening drop-in.
#
# Purpose: lock sshd down to key-only auth for a queue host that's
# reachable from the internet. vq's entire transport is SSH (`ssh HOST
# vq <verb>`, `scp` for fetch), so hardening sshd hardens vq.
#
# Install on the QUEUE HOST (e.g. compute-host), not the laptop:
#
#   sudo cp vq-hardening.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t                      # validate config BEFORE reload
#   sudo systemctl reload sshd
#
# ⚠️  ORDER MATTERS. `PasswordAuthentication no` below means a working
#     public key MUST already be in ~/.ssh/authorized_keys before you
#     reload sshd — otherwise you lock yourself out. The safe sequence
#     (full walkthrough in vibe-queue/docs/remote-access.md):
#       1. Generate + install the key, verify `ssh HOST` works key-only.
#       2. THEN drop in this file and reload.
#       3. Keep your existing SSH session open while you test a fresh
#          connection in a second terminal — if the new one fails, you
#          still have the old session to fix it.
#
# Most distros include `Include /etc/ssh/sshd_config.d/*.conf` near the
# top of /etc/ssh/sshd_config; drop-ins there override the main file.
# Confirm with `grep -r Include /etc/ssh/sshd_config`.

# --- Authentication: key-only -------------------------------------------
# No passwords, no keyboard-interactive. A scanner that finds your port
# literally cannot attempt a password. The SSH key is the sole
# credential — treat the private key like a root password (passphrase,
# ssh-agent, dedicated to this host). See the security model section of
# docs/remote-access.md: `vq submit` runs arbitrary code as this user,
# so the key IS a code-execution credential for the host.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# --- Account scoping ----------------------------------------------------
# No direct root login. Only the queue user may log in at all — adjust
# `vqadmin` to your host's queue account. Adding a second submitter later
# means appending their pubkey to ~/.ssh/authorized_keys AND adding them
# here.
PermitRootLogin no
AllowUsers vqadmin

# --- Brute-force / scan friction ---------------------------------------
# Key-only auth already defeats password brute force; these just trim
# the log noise and the per-connection budget a scanner gets. Pair with
# fail2ban (or sshguard) for IP bans on repeated failures.
MaxAuthTries 3
LoginGraceTime 20

# --- Drop features vq doesn't use --------------------------------------
# vq needs none of X11, agent forwarding, or tunnelling. Turning them
# off shrinks the attack surface of an authenticated session.
#
# NOTE: AllowTcpForwarding is deliberately LEFT AT DEFAULT (yes). The
# `ssh -L 8765:localhost:8765 HOST` trick for viewing the read-only web
# dashboard over an SSH tunnel needs local port forwarding. If you never
# use the dashboard, you can add `AllowTcpForwarding no` here too.
X11Forwarding no
AllowAgentForwarding no

# --- Optional: run sshd itself on a non-standard port ------------------
# The recommended topology is: sshd stays on 22 internally, and the
# router forwards an external port -> compute-host:22. In that setup you do
# NOT set Port here — the non-standard port lives only in the router
# forward + the laptop's ~/.ssh/config.
#
# If instead you want sshd to bind a non-22 port directly (no NAT, or
# the router does straight pass-through), uncomment and set it — and
# remember to open that port in any host firewall (ufw/firewalld):
#
#   Port 49999
#
# Port choice guidance (docs/remote-access.md has the full reasoning):
# use a HIGH port in the dynamic/private range 49152-65535. Low ports
# (including 24, 28) get swept by scanners almost as hard as 22 and earn
# you none of the log-noise reduction; a high unassigned port dodges the
# bulk of automated scanning. The port is NOT a security control — the
# key-only auth above is — it's purely noise reduction.
