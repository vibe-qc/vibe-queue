<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="vq, a cross-machine job queue">
  <title>vq, a cross-machine job queue</title>
  <desc>Social preview card: the vq queue glyph and wordmark over a pale ground,
        with a row of tokens advancing along a rail. Three are lit, the rest fade
        toward the right edge, and the rail continues past the frame.</desc>

  <!-- Ground. Kept a flat pale field rather than a gradient: this is rasterised
       once to PNG and then scaled down hard by every chat client that unfurls it. -->
  <rect width="1200" height="630" fill="#F8FAFC"/>
  <rect y="614" width="1200" height="16" fill="#0F766E"/>

  <!-- Glyph, the favicon at 3.5x. -->
  <g id="vq-glyph" transform="translate(96,92) scale(3.5)">
    <rect x="3" y="3" width="26" height="26" rx="5" ry="5" fill="none" stroke="#0F766E" stroke-width="2"/>
    <rect x="6" y="9.5" width="5" height="9" rx="1.6" ry="1.6" fill="#0F766E"/>
    <rect x="13.5" y="9.5" width="5" height="9" rx="1.6" ry="1.6" fill="#0F766E" opacity="0.55"/>
    <rect x="21" y="9.5" width="5" height="9" rx="1.6" ry="1.6" fill="#0F766E" opacity="0.25"/>
    <line x1="6" y1="21.5" x2="26" y2="21.5" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark, drawn as primitives so the card needs no font for its own name. -->
  <g transform="translate(248,86) scale(4.2)" stroke="#0F172A" fill="#0F172A" stroke-linejoin="round">
    <line x1="0.0" y1="8" x2="6.0" y2="24" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="12.0" y1="8" x2="6.0" y2="24" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="20.0" cy="16.0" r="4.8" fill="none" stroke-width="3.2"/>
    <line x1="24.8" y1="8" x2="24.8" y2="30" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <text x="96" y="352" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" fill="#0F172A">A cross-machine job queue.</text>
  <text x="96" y="410" font-family="Georgia, 'Times New Roman', serif"
        font-size="30" fill="#475569">Submit here. Run there. Fetch the results back.</text>
  <text x="96" y="470" font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="26" fill="#0F766E">vq submit compute -- python optimise.py</text>

  <!-- The queue itself: lit near the viewer, fading out past the right edge,
       because the rail is never shown to end. -->
  <g>
    <line x1="96" y1="556" x2="1200" y2="556" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="3">
      <rect x="96"  y="510" width="58" height="42" rx="7" fill="#FFFFFF" stroke="#0F766E"/>
      <rect x="176" y="510" width="58" height="42" rx="7" fill="#FFFFFF" stroke="#0F766E"/>
      <rect x="256" y="510" width="58" height="42" rx="7" fill="#FFFFFF" stroke="#0F766E"/>
      <rect x="336" y="510" width="58" height="42" rx="7" opacity="0.72"/>
      <rect x="416" y="510" width="58" height="42" rx="7" opacity="0.58"/>
      <rect x="496" y="510" width="58" height="42" rx="7" opacity="0.44"/>
      <rect x="576" y="510" width="58" height="42" rx="7" opacity="0.32"/>
      <rect x="656" y="510" width="58" height="42" rx="7" opacity="0.22"/>
      <rect x="736" y="510" width="58" height="42" rx="7" opacity="0.14"/>
      <rect x="816" y="510" width="58" height="42" rx="7" opacity="0.08"/>
    </g>
    <!-- The lit edge each token carries: running, running, pending. -->
    <g stroke="#14B8A6" stroke-width="5" stroke-linecap="round">
      <line x1="100" y1="552" x2="150" y2="552"/>
      <line x1="180" y1="552" x2="230" y2="552"/>
      <line x1="260" y1="552" x2="310" y2="552" opacity="0.45"/>
    </g>
  </g>
</svg>
